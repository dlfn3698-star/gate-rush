<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gate Rush</title>
<style>
  :root{ --bg:#0e1116; --ink:#e6edf3; --muted:#9aa4af; --accent:#3b82f6; --red:#ef4444; --green:#22c55e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; overflow:hidden; touch-action:none}
  #wrap{position:fixed; inset:0}
  canvas{display:block; touch-action:none}
  .overlay{position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(8,10,14,.86); padding:24px; text-align:center}
  .overlay.show{display:flex}
  .overlay h1{margin:0; font-size:34px; font-weight:900}
  .overlay p{margin:0; color:var(--muted); font-size:15px; line-height:1.6; max-width:330px}
  .big{font-size:26px; font-weight:800}
  .win{color:var(--green)} .lose{color:var(--red)}
  button{border:0; border-radius:14px; padding:15px 30px; font-size:17px; font-weight:800; color:#fff;
    background:var(--accent); cursor:pointer}
  button:active{transform:translateY(1px)}
  kbd{background:#222b37; border-radius:5px; padding:1px 7px; font-size:12px; border:1px solid #30363d}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div class="overlay show" id="startO">
  <h1>GATE RUSH</h1>
  <p>대포를 좌우로 움직여 병사를 쏘세요. 병사가 <b style="color:#f5c518">배수 문</b>을 지나면 불어납니다.
  <b style="color:#ef4444">붉은 군단</b>을 밀어내고 위쪽 적 기지를 부수면 승리.</p>
  <p>붉은 <b style="color:#ef4444">÷ 문</b>은 병사를 줄입니다. 적은 시간이 갈수록 많아져요.</p>
  <p style="font-size:13px">드래그 / 마우스 이동, 또는 <kbd>←</kbd> <kbd>→</kbd> · 발사는 자동</p>
  <button id="startBtn">시작</button>
</div>

<div class="overlay" id="endO">
  <h1 id="endTitle"></h1>
  <div class="big" id="endSub"></div>
  <p id="endMsg"></p>
  <button id="again">다시</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const FW=360, FH=640, BASE_Y=58, LINE_Y=578, CANNON_Y=602, STEER_Y=310;
const MAXB=2600, MAXR=2600, CELL=8, COLS=45, ROWS=80;
const head=new Int32Array(COLS*ROWS), nextIdx=new Int32Array(MAXR+64);
const CC=24, CCOLS=15, CROWS=27, cw=new Float32Array(CCOLS*CROWS), csx=new Float32Array(CCOLS*CROWS), csy=new Float32Array(CCOLS*CROWS);
let W=0,H=0,DPR=1,S=1,OX=0,OY=0;
function resize(){
  W=window.innerWidth; H=window.innerHeight; DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  S=Math.min(W/FW,H/FH); OX=(W-FW*S)/2; OY=(H-FH*S)/2;
}
window.addEventListener('resize',resize); resize();
const rnd=Math.random;
let G=null;

function gate(op,val,x0,x1,y,move){
  const g={op,val,x0,x1,y,flash:0};
  if(move){ g.amp=move.amp; g.spd=move.spd; g.ph=move.ph||0; g.c0=(x0+x1)/2; g.hw=(x1-x0)/2; }
  return g;
}
function buildStage(stage){
  const gates=[], walls=[];
  // hedges separating the side lanes
  walls.push({x0:98,x1:122,y0:330,y1:452});
  walls.push({x0:238,x1:262,y0:330,y1:452});
  // center gate (wide, modest). Moves from stage 2.
  gates.push(gate('×',3,134,226,440, stage>=2?{amp:22+Math.min(30,stage*5),spd:1.2+stage*0.12}:null));
  // right lane: two stacked gates
  const rv=2+Math.floor(stage/3);
  gates.push(gate('×',rv,266,344,420));
  gates.push(gate('×',2,266,344,360));
  // left lane: big stack, but narrow and guarded by a sweeping ÷ gate
  const lv=[[3,3],[3,2,2],[3,3,2],[3,3,3]][Math.min(3,stage-1)];
  lv.forEach((v,i)=>gates.push(gate('×',v,18,92,425-i*45)));
  gates.push(gate('÷',2,10,60,492,{amp:34,spd:1.6+stage*0.15,ph:1}));
  if(stage>=2) gates.push(gate('÷',2,270,320,470,{amp:26,spd:2.0+stage*0.1,ph:2}));
  if(stage>=4) gates.push(gate('÷',3,150,210,500,{amp:70,spd:1.1,ph:0.5}));
  return {gates,walls};
}
function newGame(stage){
  const st=buildStage(stage);
  G={ stage, t:0, state:'play', cx:180, tx:180, fire:0, fireRate:6,
      blues:[], reds:[], gates:st.gates, walls:st.walls,
      hp:30, hpMax:30,
      base:Math.round(350*Math.pow(stage,1.15)), baseMax:Math.round(350*Math.pow(stage,1.15)),
      r0:6+stage*3, rGrow:0.3+stage*0.15, rMax:420, rSpeed:36+stage*2, racc:0, shake:0, hurt:0 };
  if(location.hash==='#dev') window.__g=G;
}
function addBlue(x,y,vx,w){
  const B=G.blues;
  if(B.length>=MAXB){ B[(rnd()*B.length)|0].w+=w; return; }
  B.push({x,y,py:y,vx,vy:-122,w});
}
function addRed(w){
  const R=G.reds;
  if(R.length>=MAXR){ R[(rnd()*R.length)|0].w+=w; return; }
  R.push({x:180+(rnd()-0.5)*130, y:BASE_Y+4+rnd()*8, vx:(rnd()-0.5)*26, w});
}
function pushOut(p,walls){
  for(const w of walls){
    if(p.x>w.x0 && p.x<w.x1 && p.y>w.y0 && p.y<w.y1){
      p.x = (p.x-w.x0 < w.x1-p.x) ? w.x0-0.5 : w.x1+0.5; p.vx*=0.3;
    }
  }
}
function compact(arr){ let j=0; for(let i=0;i<arr.length;i++){ if(arr[i].w>1e-6) arr[j++]=arr[i]; } arr.length=j; }

function step(dt){
  G.t+=dt;
  if(keys.ArrowLeft||keys.a) G.tx-=300*dt;
  if(keys.ArrowRight||keys.d) G.tx+=300*dt;
  G.tx=Math.max(22,Math.min(FW-22,G.tx));
  G.cx+=(G.tx-G.cx)*Math.min(1,dt*16);
  if(G.shake>0) G.shake-=dt; if(G.hurt>0) G.hurt-=dt;
  for(const g of G.gates){
    if(g.amp){ const c=g.c0+Math.sin(G.t*g.spd+g.ph)*g.amp; g.x0=c-g.hw; g.x1=c+g.hw; }
    if(g.flash>0) g.flash-=dt;
  }
  // fire
  G.fire+=dt*G.fireRate;
  while(G.fire>=1){ G.fire-=1; addBlue(G.cx+(rnd()-0.5)*6, CANNON_Y-18, (rnd()-0.5)*8, 1); }
  // red spawn (escalates)
  const rate=Math.min(G.rMax, G.r0+G.t*G.rGrow);
  G.racc+=rate*dt;
  while(G.racc>=1){ G.racc-=1; addRed(1); }

  // reds
  const R=G.reds, B=G.blues, walls=G.walls;
  cw.fill(0); csx.fill(0); csy.fill(0);
  for(let i=0;i<R.length;i++){
    const r=R[i];
    r.vx+=(rnd()-0.5)*90*dt;
    if(r.y>440) r.vx+=Math.sign(G.cx-r.x)*70*dt;
    if(r.vx>26) r.vx=26; else if(r.vx<-26) r.vx=-26;
    r.x+=r.vx*dt; r.y+=G.rSpeed*dt;
    if(r.x<14){r.x=14;r.vx=Math.abs(r.vx);} else if(r.x>FW-14){r.x=FW-14;r.vx=-Math.abs(r.vx);}
    pushOut(r,walls);
    if(r.y>LINE_Y){ G.hp-=r.w; r.w=0; G.hurt=0.25; }
    else { const ci=Math.min(CCOLS-1,(r.x/CC)|0)+Math.min(CROWS-1,(r.y/CC)|0)*CCOLS; cw[ci]+=r.w; csx[ci]+=r.x*r.w; csy[ci]+=r.y*r.w; }
  }
  compact(R);
  head.fill(-1);
  for(let i=0;i<R.length;i++){
    const r=R[i]; const c=((r.x/CELL)|0)+((r.y/CELL)|0)*COLS;
    nextIdx[i]=head[c]; head[c]=i;
  }
  // blues
  for(let i=0;i<B.length;i++){
    const b=B[i];
    if(b.y<STEER_Y){
      // seek the nearest red cluster (coarse grid), else march on the base
      const ccx=Math.min(CCOLS-1,(b.x/CC)|0), ccy=Math.min(CROWS-1,(b.y/CC)|0);
      let bd=1e9, tx=0, ty=0;
      for(let gy=ccy-4;gy<=ccy+4;gy++){ if(gy<0||gy>=CROWS) continue;
        for(let gx=ccx-4;gx<=ccx+4;gx++){ if(gx<0||gx>=CCOLS) continue;
          const ci=gx+gy*CCOLS; if(cw[ci]<=0) continue;
          const mx=csx[ci]/cw[ci], my=csy[ci]/cw[ci], d=(mx-b.x)*(mx-b.x)+(my-b.y)*(my-b.y);
          if(d<bd){bd=d;tx=mx;ty=my;}
        }
      }
      let dvx=0, dvy=-122;
      if(bd<1e9){ const d=Math.sqrt(bd)||1; dvx=(tx-b.x)/d*122; dvy=(ty-b.y)/d*122; }
      const k=Math.min(1,dt*6); b.vx+=(dvx-b.vx)*k; b.vy+=(dvy-b.vy)*k;
    } else { b.vy=-122; if(b.vx>75) b.vx=75; else if(b.vx<-75) b.vx=-75; }
    b.py=b.y; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<14){b.x=14;b.vx=0;} else if(b.x>FW-14){b.x=FW-14;b.vx=0;}
    pushOut(b,walls);
    // gates
    for(const g of G.gates){
      if(b.py>g.y && b.y<=g.y && b.x>=g.x0 && b.x<=g.x1){
        g.flash=0.12;
        if(g.op==='×'){
          const total=b.w*g.val;
          const k=Math.max(0,Math.min(g.val-1, MAXB-B.length));
          const each=total/(k+1); b.w=each;
          for(let n=0;n<k;n++) B.push({x:b.x+(rnd()-0.5)*16, y:g.y-1-rnd()*7, py:g.y-1, vx:(rnd()-0.5)*50, vy:-122, w:each});
        } else { // ÷
          if(b.w>1.5) b.w/=g.val; else if(rnd()>1/g.val) b.w=0;
        }
      }
    }
    if(b.w<=1e-6) continue;
    // fight
    const cx=(b.x/CELL)|0, cy=(b.y/CELL)|0;
    fight:
    for(let gy=cy-1;gy<=cy+1;gy++){ if(gy<0||gy>=ROWS) continue;
      for(let gx=cx-1;gx<=cx+1;gx++){ if(gx<0||gx>=COLS) continue;
        for(let idx=head[gx+gy*COLS]; idx>=0; idx=nextIdx[idx]){
          const r=R[idx]; if(r.w<=1e-6) continue;
          const dx=r.x-b.x, dy=r.y-b.y;
          if(dx*dx+dy*dy<49){ const m=Math.min(b.w,r.w); b.w-=m; r.w-=m; if(b.w<=1e-6) break fight; }
        }
      }
    }
    if(b.w>1e-6 && b.y<BASE_Y){ G.base-=b.w; b.w=0; G.shake=0.08; }
  }
  compact(B); compact(R);
  if(G.base<=0) return win();
  if(G.hp<=0) return lose();
}

// ---- input ----
function setTarget(clientX){ if(G) G.tx=Math.max(22,Math.min(FW-22,(clientX-OX)/S)); }
let drag=false;
cv.addEventListener('pointerdown',e=>{drag=true; setTarget(e.clientX);});
window.addEventListener('pointermove',e=>{ if(drag||e.pointerType==='mouse') setTarget(e.clientX); });
window.addEventListener('pointerup',()=>drag=false);
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function dots(arr,color){
  ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<arr.length;i++){ const p=arr[i]; const s=p.w<=1.2?2.3:Math.min(6,2.3+Math.log2(p.w)*0.9);
    ctx.moveTo(p.x+s,p.y); ctx.arc(p.x,p.y,s,0,6.283); }
  ctx.fill();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0e1116'; ctx.fillRect(0,0,W,H);
  const sh=(G&&G.shake>0)?(rnd()-0.5)*3:0;
  ctx.setTransform(DPR*S,0,0,DPR*S,DPR*(OX+sh),DPR*OY);
  // field
  ctx.fillStyle='#aab1bb'; ctx.fillRect(0,0,FW,FH);
  ctx.strokeStyle='rgba(0,0,0,.06)'; ctx.lineWidth=1;
  for(let y=40;y<FH;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(FW,y); ctx.stroke(); }
  for(let x=40;x<FW;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,FH); ctx.stroke(); }
  ctx.fillStyle='#4b5563'; ctx.fillRect(0,0,10,FH); ctx.fillRect(FW-10,0,10,FH);
  if(!G){ return; }
  // enemy base
  ctx.fillStyle='#7f1d1d'; ctx.fillRect(10,0,FW-20,BASE_Y-8);
  ctx.fillStyle='#b91c1c'; ctx.fillRect(10,BASE_Y-12,FW-20,4);
  // defence line
  ctx.strokeStyle=G.hurt>0?'#ef4444':'rgba(59,130,246,.7)'; ctx.setLineDash([8,6]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(10,LINE_Y); ctx.lineTo(FW-10,LINE_Y); ctx.stroke(); ctx.setLineDash([]);
  // hedges
  for(const w of G.walls){ ctx.fillStyle='#2f6b2f'; rr(w.x0,w.y0,w.x1-w.x0,w.y1-w.y0,6); ctx.fill();
    ctx.fillStyle='#3d8a3d'; rr(w.x0+3,w.y0+3,w.x1-w.x0-6,w.y1-w.y0-10,5); ctx.fill(); }
  // gates
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const g of G.gates){
    const bad=g.op==='÷', big=g.val>=3&&!bad;
    ctx.fillStyle= bad?'#dc2626': big?'#f5c518':'#3b82f6';
    if(g.flash>0) ctx.fillStyle='#ffffff';
    rr(g.x0,g.y-11,g.x1-g.x0,22,5); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(g.x0+2,g.y+7,g.x1-g.x0-4,3);
    ctx.fillStyle= (g.flash>0||big)?'#111':'#fff'; ctx.font='800 15px system-ui,sans-serif';
    ctx.fillText(g.op+g.val,(g.x0+g.x1)/2,g.y-1);
  }
  dots(G.reds,'#e11d48'); dots(G.blues,'#1d4ed8');
  // cannon
  const cx=G.cx;
  ctx.fillStyle='#374151'; rr(cx-16,CANNON_Y-4,32,18,5); ctx.fill();
  ctx.fillStyle='#111827'; rr(cx-7,CANNON_Y-24,14,26,4); ctx.fill();
  ctx.fillStyle='#60a5fa'; ctx.beginPath(); ctx.arc(cx,CANNON_Y+5,5,0,7); ctx.fill();
  // HUD
  ctx.fillStyle='rgba(0,0,0,.45)'; rr(60,14,FW-120,14,7); ctx.fill();
  ctx.fillStyle='#f87171'; rr(60,14,Math.max(0,(FW-120)*G.base/G.baseMax),14,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 10px system-ui,sans-serif';
  ctx.fillText('적 기지 '+Math.max(0,Math.ceil(G.base)),FW/2,21.5);
  ctx.textAlign='left'; ctx.font='800 12px system-ui,sans-serif'; ctx.fillStyle='#fff';
  ctx.fillText('ST '+G.stage,16,21);
  let bw=0; for(const b of G.blues) bw+=b.w;
  ctx.textAlign='right'; ctx.fillText(Math.round(bw)+'',FW-16,21);
  // player hp
  ctx.fillStyle='rgba(0,0,0,.35)'; rr(14,FH-14,FW-28,8,4); ctx.fill();
  ctx.fillStyle='#3b82f6'; rr(14,FH-14,Math.max(0,(FW-28)*G.hp/G.hpMax),8,4); ctx.fill();
}

// ---- loop / states ----
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;
  if(G&&G.state==='play') step(dt);
  draw(); requestAnimationFrame(frame);
}
const endO=document.getElementById('endO'), endTitle=document.getElementById('endTitle'),
      endSub=document.getElementById('endSub'), endMsg=document.getElementById('endMsg'), again=document.getElementById('again');
function win(){
  G.state='end';
  try{ const b=Math.max(G.stage,+(localStorage.getItem('gr2_best')||0)); localStorage.setItem('gr2_best',b); }catch(e){}
  endTitle.textContent='승리'; endTitle.className='win';
  endSub.textContent='STAGE '+G.stage+' 돌파 · '+Math.round(G.t)+'초';
  endMsg.textContent='다음 스테이지는 적이 더 빨리 불어나고 방해 문이 늘어납니다.';
  again.textContent='다음 스테이지'; again.dataset.next=G.stage+1; endO.classList.add('show');
}
function lose(){
  G.state='end';
  endTitle.textContent='패배'; endTitle.className='lose';
  endSub.textContent='방어선이 뚫렸다';
  endMsg.textContent='STAGE '+G.stage+'. 배수가 큰 문으로 병력을 불리되, 내려오는 적을 놓치지 마세요.';
  again.textContent='재도전'; again.dataset.next=G.stage; endO.classList.add('show');
}
document.getElementById('startBtn').onclick=()=>{ document.getElementById('startO').classList.remove('show'); newGame(1); };
again.onclick=()=>{ endO.classList.remove('show'); newGame(+again.dataset.next||1); };
if(location.hash==='#dev') window.__start=(s)=>{ document.getElementById('startO').classList.remove('show'); endO.classList.remove('show'); newGame(s); };
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
